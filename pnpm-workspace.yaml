packages:
  - packages/*
  - apps/*
  - modules/*
  - examples/*

catalog:
  '@types/node': ^26.6.5
  '@vitejs/plugin-vue': ^6.0.10
  '@vitest/coverage-v8': 5.0.5
  primeicons: ^8.0.2
  reka-ui: ^2.11.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  vue: ^3.5.44
  vue-router: ^5.4.0

ignoredBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - vue-demi

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

settings:
  autoInstallPeers: true
  dedupe-peer-dependents: true
  excludeLinksFromLockfile: false
  prefer-workspace-packages: true
