packages:
  - packages/*
  - apps/*
  - modules/*
  - examples/*

catalog:
  "@types/node": ^25.6.2
  "@vitejs/plugin-vue": ^6.0.8
  primeicons: ^7.0.0
  reka-ui: ^2.10.4
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vue: ^3.5.42
  vue-router: ^5.3.1
  vitest: 4.1.11
  vite-plus: 0.3.0
  "@vitest/coverage-v8": 4.1.11

settings:
  autoInstallPeers: true
  dedupe-peer-dependents: true
  excludeLinksFromLockfile: false
  prefer-workspace-packages: true
ignoredBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - vue-demi
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
